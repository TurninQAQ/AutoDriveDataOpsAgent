# Local-only GPU hardware model for PLATFORM_GPU_RUNTIME=simulated.
# external_used_mb represents memory used outside platform reservations.
gpus:
  - id: 0
    total_memory_mb: 48000
    external_used_mb: 0
  - id: 1
    total_memory_mb: 48000
    external_used_mb: 12000
  - id: 2
    total_memory_mb: 24000
    external_used_mb: 20000
