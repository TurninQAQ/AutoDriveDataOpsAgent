# V0.6 deterministic defaults used by Natural Language Task Planning.
# These values come from the repository's existing task template/current config,
# not from the LLM. Change this file when platform defaults or image versions move.

task_defaults:
  task_type: ""
  pipeline_stages:
    - precheck
    - parser
    - segment
    - map
    - [od, occ]
    - coloration
  max_active_runs: 5
  task_exclusive: true
  task_lock_wait_interval_sec: 10
  preempt_grace_timeout_min: 60
  gpu:
    gpu_ids: "5,6,7,8,9"
    gpu_stages: [segment, od, occ]
    exclusive_gpu_stages: [segment, od]
    exclusive_gpu_idle_used_max_mb: 512
    gpu_stage_memory_mb:
      segment: 24000
      od: 12000
      occ: 4000
    gpu_wait_interval_sec: 10
    gpu_reservation_pending_sec: 60

dataset_defaults:
  tier: small
  pool: default_pool
  timeout_min: 60
  image_qc: batch-processor:d

# Current concrete image defaults are centralized here so the planner never invents
# image names/tags. The generated YAML only includes images required by the selected
# pipeline stages.
image_defaults:
  parser: 172.16.201.100:5000/data_parser:v1.1.1_cidi_07-15_16_12_27
  segment: 172.16.201.100:5000/sam31:v1.1.2_cfy_07-15_14_25_15
  map: 172.16.201.100:5000/offline_mapping:v1.1.3_cidi_07-15_17_52_07
  od: 172.16.201.100:5000/label_od:v1.1.14_nty_07-07_17_54_58
  coloration: 172.16.201.100:5000/pointcloud_coloration:v1.1.0_cidi_07-15_17_44_25
  occ: 172.16.201.100:5000/label_occ:v1.0.27_cidi_07-21_10_15_45
