[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodrive-dataops-agent"
version = "3.9.0"
description = "AutoDriveDataOpsAgent V3.9 RC: durable Guarded ReAct with standard MCP, HITL, hybrid RAG, API and benchmark"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.11",
    "mcp>=2,<3",
    "starlette>=0.37,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "typing-extensions>=4.12,<5",
    "PyYAML>=6,<7",
    "requests>=2.31,<3",
    "google-genai>=1,<4",
    "langgraph-checkpoint-sqlite>=2,<4",
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
api = []

[project.scripts]
autodrive-agent = "deploy_ci_cloud_agentv3.cli:main"
autodrive-mcp-v3 = "deploy_ci_cloud_agentv3.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["deploy_ci_cloud_agentv3/tests"]
pythonpath = ["."]
markers = ["real_langgraph: installed LangGraph runtime", "integration: integration tests", "external_llm: requires external LLM", "external_embedding: requires external embedding API"]

[tool.setuptools.packages.find]
where = ["."]
include = ["deploy_ci_cloud_agentv3*"]

[tool.setuptools.package-data]
deploy_ci_cloud_agentv3 = ["doc/*.md", "evaluation/*.jsonl", "evaluation/cases/*.jsonl"]
"deploy_ci_cloud_agentv3.platform_backend" = [
    "knowledge/**/*.md",
    "knowledge/**/*.yaml",
    "knowledge/**/*.yml",
    "knowledge/**/*.json",
    "knowledge/**/*.jsonl",
    "knowledge/**/*.txt",
    "scripts/*.sh",
    "dags/templates/*",
    "config/*.yaml",
]
