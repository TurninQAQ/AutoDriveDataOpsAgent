[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodrive-dataops-agent"
version = "3.5.0"
description = "AutoDriveDataOpsAgent V3.5: Single-Agent Guarded ReAct with standard MCP and human-approved writes"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.11",
    "mcp>=2,<3",
    "starlette>=0.37,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "typing-extensions>=4.12,<5",
    "PyYAML>=6,<7",
    "requests>=2.31,<3",
    "google-genai>=1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
api = ["fastapi>=0.115,<1"]

[project.scripts]
autodrive-agent = "deploy_ci_cloud_agentv3.cli:main"
autodrive-agent-v2 = "deploy_ci_cloud_agentv2.cli:main"
autodrive-mcp-v3 = "deploy_ci_cloud_agentv3.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["deploy_ci_cloud_agentv3/tests", "deploy_ci_cloud_agentv2/tests"]
pythonpath = ["."]
markers = ["real_langgraph: tests requiring the installed LangGraph 1.2.11 runtime"]

[tool.setuptools.packages.find]
where = ["."]
include = ["deploy_ci_cloud_agentv2*", "deploy_ci_cloud_agentv3*"]

[tool.setuptools.package-data]
deploy_ci_cloud_agentv2 = ["doc/*.md"]
"deploy_ci_cloud_agentv2.platform_backend" = [
    "knowledge/**/*.md",
    "knowledge/**/*.yaml",
    "knowledge/**/*.yml",
    "knowledge/**/*.json",
    "knowledge/**/*.jsonl",
    "knowledge/**/*.txt",
    "scripts/*.sh",
    "dags/templates/*",
    "config/*.yaml",
]
deploy_ci_cloud_agentv3 = ["doc/*.md"]
