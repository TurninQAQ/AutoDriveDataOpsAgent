name: autodrive-v3-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned runtime and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools\>=68 wheel
          python -m pip install -e '.[test]'
      - name: Assert real LangGraph package
        run: |
          python -c 'import importlib.metadata, langgraph; assert importlib.metadata.version("langgraph") == "1.2.11"; assert not getattr(langgraph, "__v2_test_compat__", False); print(langgraph.__path__)'
      - name: Run V3 tests on real LangGraph and MCP
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q deploy_ci_cloud_agentv3/tests
      - name: Run marked real LangGraph tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -m real_langgraph -q deploy_ci_cloud_agentv3/tests
      - name: Compile
        run: python -m compileall -q deploy_ci_cloud_agentv3
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/autodrive-wheel
      - name: Wheel import smoke
        run: |
          python -m venv /tmp/autodrive-wheel-venv
          /tmp/autodrive-wheel-venv/bin/python -m pip install /tmp/autodrive-wheel/*.whl
          cd /tmp
          /tmp/autodrive-wheel-venv/bin/python -c 'import deploy_ci_cloud_agentv3; print(deploy_ci_cloud_agentv3.__version__)'
          /tmp/autodrive-wheel-venv/bin/autodrive-agent health
      - name: Static architecture audit
        run: |
          ! rg -n 'deploy_ci_cloud_agentv2' deploy_ci_cloud_agentv3 pyproject.toml --glob '*.py' --glob '*.toml'
          ! rg -n -P 'deploy_ci_cloud_agent(?!v3)' deploy_ci_cloud_agentv3 pyproject.toml --glob '*.py' --glob '*.toml'
          ! rg -n 'class (Planner|Router|Supervisor)|AUTO_WRITE|autonomous mutation budget' deploy_ci_cloud_agentv3 --glob '*.py'
          ! rg -n -P 'sk-[A-Za-z0-9]{20,}' deploy_ci_cloud_agentv3 --glob '*.py'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production container
        run: docker build --tag autodrive-dataops-agent-v3:ci .
      - name: Prepare container runtime volume
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/autodrive-dataops-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          # The image deliberately runs as UID 10001.  A runner-created
          # mktemp directory is normally mode 0700 and would therefore make
          # the mounted runtime volume inaccessible to the container user.
          chmod 0777 "$runtime_dir"
          echo "AUTODRIVE_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

      - name: Assert container non-root identity
        run: test "$(docker run --rm --entrypoint id autodrive-dataops-agent-v3:ci -u)" = "10001"

      - name: Run container health smoke
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --volume "$AUTODRIVE_RUNTIME_DIR:/var/lib/autodrive-dataops" \
            autodrive-dataops-agent-v3:ci health

      - name: Run container readiness smoke without external credentials
        run: |
          set +e
          docker run --rm --read-only --tmpfs /tmp \
            --volume "$AUTODRIVE_RUNTIME_DIR:/var/lib/autodrive-dataops" \
            autodrive-dataops-agent-v3:ci ready
          ready_rc=$?
          set -e
          test "$ready_rc" -eq 1

      - name: Assert readiness persisted local SQLite state
        run: test -f "$AUTODRIVE_RUNTIME_DIR/state/autodrive_state.sqlite"

      - name: Run second container readiness smoke on same volume
        run: |
          set +e
          docker run --rm --read-only --tmpfs /tmp \
            --volume "$AUTODRIVE_RUNTIME_DIR:/var/lib/autodrive-dataops" \
            autodrive-dataops-agent-v3:ci ready
          second_rc=$?
          set -e
          test "$second_rc" -eq 1
